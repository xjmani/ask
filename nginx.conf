server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Map .mjs to text/javascript so the browser accepts the vendored ESM
    # modules. nginx's default mime.types still serves .mjs as
    # application/octet-stream which browsers reject for `import` statements.
    types {
        text/javascript            js mjs;
        text/css                   css;
        text/html                  html;
        image/svg+xml              svg;
        image/png                  png;
        image/x-icon               ico;
        application/json           json webmanifest;
        application/wasm           wasm;
        font/woff2                 woff2;
        font/woff                  woff;
    }
    default_type application/octet-stream;

    # gzip text assets. Binary vendor (wasm, onnx, web-llm.mjs bundle) is
    # already compressed or large enough that gzip doesn't help meaningfully.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json image/svg+xml;

    # All add_header directives at server scope. nginx replaces the inherited
    # set whenever a location adds even one header, so they stay centralized.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'unsafe-eval' is required because pdfjs uses Function() at runtime for
    # font / Type1 parsing, and onnxruntime-web compiles wasm modules.
    # connect-src is opened to huggingface.co so WebLLM can download the
    # Llama 3.2 3B model on first use. Once cached in OPFS the page runs
    # offline. The document, the embeddings, and the questions never travel.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
        return 200 "User-agent: *\nAllow: /\n";
    }
}
